[profile.default]
src = "contracts/src"
test = "contracts/test"
out = "out"
cache_path = "cache"
libs = ["node_modules"]
solc_version = "0.8.30"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "shanghai"
remappings = [
  "@openzeppelin/=node_modules/@openzeppelin/",
  "@gluwa/asc-contracts/=node_modules/@gluwa/asc-contracts/",
]
fs_permissions = [{ access = "read", path = "./docs" }]

[profile.default.fuzz]
runs = 512

[profile.default.invariant]
runs = 256
depth = 64
fail_on_revert = false

[rpc_endpoints]
cc3_testnet = "${CC3_TESTNET_RPC}"
ethereum = "${ETHEREUM_RPC}"
sepolia = "${SEPOLIA_RPC}"
