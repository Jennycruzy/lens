name: tests

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly, for the runs that touch live networks and are too slow per-commit.
    - cron: '17 3 * * *'

jobs:
  fast:
    name: unit, adversarial, invariant
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - run: npm ci --no-audit --no-fund
      - run: forge install foundry-rs/forge-std --no-git

      - name: build
        run: forge build

      # Everything that needs no network. These run on every commit.
      - name: unit, adversarial, invariant and property tests
        run: forge test --no-match-path 'contracts/test/fork/*'

      # The generator reads .env for RPC URLs; the example file carries the public ones.
      - name: the page's feed list is generated, not a second copy
        run: |
          cp .env.example .env
          node tools/build-web-config.mjs --check

      - name: the page is well-formed and references only files that exist
        run: node tools/web-static.mjs

      - name: formatting
        run: forge fmt --check
        continue-on-error: true

  live:
    name: fork tests and live checks
    runs-on: ubuntu-latest
    # Fork tests hit public RPCs, which rate-limit. Running them per-commit on a busy
    # repository gets the runner throttled and the failures are not about the code.
    if: github.event_name == 'schedule' || github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with: { node-version: 22 }

      - run: npm ci --no-audit --no-fund
      - run: forge install foundry-rs/forge-std --no-git

      - name: fork tests against real mainnet contracts
        env:
          ETHEREUM_RPC: ${{ secrets.ETHEREUM_RPC || 'https://ethereum-rpc.publicnode.com' }}
        run: forge test --match-path 'contracts/test/fork/*'

      # The tools read .env; the example file carries the public endpoints and the
      # committed deployments.json carries the addresses, so no secret is needed here.
      - name: every dependency, re-derived from the live network
        run: |
          cp .env.example .env
          node tools/verify-infra.mjs

      - name: every claim in the docs, against the chains
        run: node tools/verify-claims.mjs

      - name: everything the web page reads, resolved live
        run: node tools/web-smoke.mjs

      # Historical mainnet comparisons need an archive endpoint. Without one the run
      # reports those feeds as inconclusive; it is not turned into a pass, and the
      # step name says whether the archive was configured.
      - name: differential, with archive access
        if: ${{ secrets.ETHEREUM_ARCHIVE_RPC != '' }}
        env:
          ETHEREUM_ARCHIVE_RPC: ${{ secrets.ETHEREUM_ARCHIVE_RPC }}
        run: |
          echo "ETHEREUM_ARCHIVE_RPC=$ETHEREUM_ARCHIVE_RPC" >> .env
          node tools/differential.mjs

      - name: differential, without archive access (mainnet feeds inconclusive)
        if: ${{ secrets.ETHEREUM_ARCHIVE_RPC == '' }}
        run: node tools/differential.mjs

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4
      - uses: foundry-rs/foundry-toolchain@v1
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm ci --no-audit --no-fund
      - run: forge install foundry-rs/forge-std --no-git
      - name: coverage over src
        env:
          ETHEREUM_RPC: https://ethereum-rpc.publicnode.com
        run: forge coverage --ir-minimum --no-match-coverage 'test|script|tokens' --report summary
      - name: symbolic proofs of the consumer's freshness arithmetic
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          ~/.local/bin/uv tool install halmos
          ~/.local/bin/halmos --match-contract FreshnessSymbolicTest
